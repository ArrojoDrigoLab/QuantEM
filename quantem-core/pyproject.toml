[build-system]
# 77 is the floor for PEP 639 (`license` as an SPDX string + `license-files`). The older
# `license = {text = ...}` table is deprecated and warns on every build.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantem-core"
version = "0.1.0"
description = "Inference and lightweight adaptation for the QuantEM and OmniEM electron-microscopy organelle segmentation models"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Arrojo e Drigo Lab, Vanderbilt University" }]
keywords = ["electron microscopy", "segmentation", "vision transformer", "organelle"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Operating System :: OS Independent",
]

# Deliberately small. No napari, no Qt, no Django, no training framework.
dependencies = [
  "torch>=2.2",
  "timm>=1.0.20",          # 1.0.20 added the DINOv3 entries + RotaryEmbeddingDinoV3
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.22",
  "safetensors>=0.4",
  "huggingface-hub>=0.24",  # the only fetcher in the ecosystem with Range-header resume
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]
dev = ["ruff>=0.6"]

[project.scripts]
quantem-weights = "quantem_em.weights.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantem_em*"]

[tool.setuptools.package-data]
# Without this the wheel ships no registry.json and every model load fails on a pip install,
# while working perfectly from a source checkout. Pinned by tests/test_packaging.py.
"quantem_em.weights" = ["registry.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Tests import after pytest.importorskip on purpose, so the guard actually guards.
"tests/**" = ["E402"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on our own deprecations, but do not police third-party ones -- napari/pydantic emit plenty
# and they are not ours to fix.
filterwarnings = [
  "ignore::DeprecationWarning",
  "error::DeprecationWarning:quantem_em",
]
