name: quantem-app macOS dmg

# Builds the macOS desktop app and attaches a .dmg to a release.
#
# PyInstaller cannot cross-compile, so this has to run on a Mac. The app is
# ad-hoc signed (`codesign -s -`), which is what arm64 needs in order to
# execute at all; it is NOT notarized, so a user's first open goes through
# System Settings -> Privacy & Security -> Open Anyway, exactly as the README
# says. Buying a Developer ID would remove that step and nothing else here
# would change except the signing identity and an added notarize step.
#
# arm64 only. A universal binary is impractical: PyTorch publishes no
# universal2 wheels, so an Intel build would be a separate artifact and is
# worth adding only if somebody asks for one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Attach the dmg to the latest release"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    working-directory: quantem_app

jobs:
  dmg:
    # macos-14 and later are Apple Silicon.
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Cargo's index and the Rust build are the slowest part of a cold run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quantem_app/desktop/src-tauri

      - name: Build the frontend
        working-directory: quantem_app/frontend
        run: |
          npm ci
          npm run build

      - name: Install the package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      # The spec is platform-neutral (paths come from pathlib, no .exe
      # assumptions); only the Windows .ps1 wrapper is not, so invoke
      # PyInstaller directly. --distpath must be exactly this: tauri.conf.json
      # declares ../../packaging/pyinstaller/dist/quantem-server as a bundle
      # resource, and a missing sidecar fails the Tauri build with a confusing
      # "resource path doesn't exist".
      - name: Build the sidecar
        env:
          PYTHONPATH: ${{ github.workspace }}/quantem_app/src
        run: |
          python -m PyInstaller packaging/pyinstaller/quantem-server.spec \
            --noconfirm \
            --workpath "${RUNNER_TEMP}/pyi-build" \
            --distpath packaging/pyinstaller/dist

      - name: Check the sidecar runs before bundling it
        run: |
          ./packaging/pyinstaller/dist/quantem-server/quantem-server --help > /dev/null
          echo "sidecar starts"

      - name: Build the app
        working-directory: quantem_app/desktop
        run: |
          npm ci
          # --bundles app only: the dmg is made below with create-dmg, because
          # tauri's bundle_dmg.sh has failed at the detach step (it mounts the
          # volume, shows the drag-to-Applications window, then errors).
          npm run tauri build -- --target aarch64-apple-darwin --bundles app

      # Sign nested code first, then the bundle. Never --deep: it is deprecated
      # and silently skips nested binaries, which then fail at launch.
      - name: Ad-hoc sign
        working-directory: quantem_app/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: |
          find QuantEM.app -type f \( -name "*.dylib" -o -name "*.so" -o -name "quantem-server" \) \
            -exec codesign --force -s - {} \;
          codesign --force -s - QuantEM.app
          codesign --verify --strict --verbose=2 QuantEM.app

      - name: Make the dmg
        working-directory: quantem_app/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: |
          brew install create-dmg
          create-dmg \
            --volname "QuantEM" \
            --icon "QuantEM.app" 160 190 \
            --app-drop-link 480 190 \
            --window-size 640 400 \
            --no-internet-enable \
            "QuantEM-macos-arm64.dmg" \
            "QuantEM.app"
          shasum -a 256 QuantEM-macos-arm64.dmg | tee QuantEM-macos-arm64.dmg.sha256

      - name: Verify the dmg carries a working app
        working-directory: quantem_app/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: |
          hdiutil attach QuantEM-macos-arm64.dmg -mountpoint /Volumes/QuantEMCheck -nobrowse
          codesign --verify --strict /Volumes/QuantEMCheck/QuantEM.app
          /Volumes/QuantEMCheck/QuantEM.app/Contents/Resources/quantem-server/quantem-server --help > /dev/null
          hdiutil detach /Volumes/QuantEMCheck
          echo "dmg mounts, app is signed, sidecar runs from inside it"

      - uses: actions/upload-artifact@v4
        with:
          name: QuantEM-macos-arm64
          path: |
            quantem_app/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/QuantEM-macos-arm64.dmg
            quantem_app/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/QuantEM-macos-arm64.dmg.sha256
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.upload_to_release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: quantem_app/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName -q .tagName)"; fi
          gh release upload "$TAG" \
            QuantEM-macos-arm64.dmg QuantEM-macos-arm64.dmg.sha256 --clobber
