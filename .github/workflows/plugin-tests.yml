name: quantem-core + napari-quantem

on:
  push:
    branches: [main]
    paths: ["quantem-core/**", "napari-quantem/**", ".github/workflows/plugin-tests.yml"]
  pull_request:
    branches: [main]
    paths: ["quantem-core/**", "napari-quantem/**", ".github/workflows/plugin-tests.yml"]

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Newest first: the project targets current napari and Python, with 3.11 as the floor
        # (napari 0.8 requires >= 3.11).
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13", "3.12", "3.11"]

    # Windows runners default stdout to cp1252, which cannot encode the check mark
    # npe2 prints on success ("UnicodeEncodeError: 'charmap' codec can't encode
    # character '✔'"). Any step here may print non-ASCII, so set it job-wide.
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # CPU-only torch: CI never needs CUDA, and the CUDA wheels are ~2.5 GB. Linux and
      # Windows both use PyTorch's explicit CPU channel. In particular, this avoids a
      # Windows PyPI wheel combination that installed successfully but failed while loading
      # c10.dll. macOS wheels on PyPI are already CPU-only.
      #
      # torchvision is installed *here*, in the same resolve as torch, rather than being
      # left to arrive later as a dependency of timm. Installing only torch from the CPU
      # index gets `torch 2.13.0+cpu`, and pip then satisfies timm's requirement from PyPI
      # with `torchvision 0.28.0` — the CUDA build. The two disagree about the operator
      # table, and importing torchvision (or timm, which imports it) dies with
      # "RuntimeError: operator torchvision::nms does not exist". Matched, both carry the
      # +cpu local version and import cleanly.
      - name: Install torch (CPU)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ] || [ "$RUNNER_OS" = "Windows" ]; then
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch torchvision
          fi

      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # PyQt6 ships Qt itself, but not the system libraries used by its xcb
          # platform plugin. Qt 6.5+ also requires libxcb-cursor0 explicitly.
          sudo apt-get install --yes \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            x11-utils

      - name: Install packages
        run: |
          pip install -e ./quantem-core[test]
          pip install -e ./napari-quantem[testing]

      - name: quantem-core tests
        # `napari-quantem[testing]` puts pytest-qt in the same environment, and it
        # instantiates a Qt binding at configure time. quantem-core has no Qt dependency,
        # and on a headless Linux runner that import fails on libEGL.so.1 and takes the
        # whole session down with an INTERNALERROR before any test runs. The napari widget
        # tests below get a real display from headless-gui.
        #
        # The plugin's pytest11 entry point is named `pytest-qt`, not `qt`; `-p no:qt`
        # is silently accepted and disables nothing.
        run: pytest quantem-core/tests -q -p no:pytest-qt

      - name: Validate the npe2 manifest
        run: |
          pip install npe2
          npe2 validate napari-quantem/src/napari_quantem/napari.yaml

      - name: napari widget tests
        uses: aganders3/headless-gui@v2
        with:
          run: pytest napari-quantem/src/napari_quantem/_tests -q

  offline:
    name: no-network behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # torch and torchvision together, for the same reason as the test job above.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ./quantem-core[test]
      # Nothing may touch the network at import, and a missing artifact must fail with an
      # actionable message rather than a stack trace.
      - name: import is network-free and offline mode raises cleanly
        env:
          QUANTEM_OFFLINE: "1"
        run: |
          python -c "import quantem_em; print(len(quantem_em.list_models()), 'models')"
          python - <<'PY'
          from quantem_em.api import load_model
          from quantem_em.weights.fetch import WeightsUnavailableError
          try:
              load_model("quantem/mito")
          except WeightsUnavailableError as e:
              assert e.missing, "the error must name the missing files"
              print("offline error is actionable:", str(e).splitlines()[0])
          else:
              raise SystemExit("expected WeightsUnavailableError")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check quantem-core napari-quantem
      - run: ruff format --check quantem-core napari-quantem
