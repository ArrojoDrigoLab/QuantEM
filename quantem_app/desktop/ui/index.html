<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuantEM</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #f6f8fb;
        color: #172033;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: radial-gradient(circle at 50% -20%, #e9f0ff 0, transparent 48%), #f6f8fb;
      }
      .card {
        width: min(620px, 100%);
        padding: 36px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #e1e6ee;
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(29, 44, 75, 0.1);
      }
      .brand { display: flex; align-items: center; gap: 14px; }
      .mark {
        width: 44px; height: 44px; display: grid; place-items: center;
        border-radius: 12px; background: #315bc5; color: white;
        font-size: 20px; font-weight: 750;
        box-shadow: 0 8px 20px rgba(49, 91, 197, 0.24);
      }
      h1 { margin: 0; font-size: 21px; line-height: 1.2; letter-spacing: -0.01em; }
      .eyebrow { margin: 3px 0 0; color: #667085; font-size: 13px; }
      .status-row { margin-top: 30px; display: flex; align-items: flex-start; gap: 13px; }
      .spinner {
        flex: 0 0 auto; width: 22px; height: 22px; margin-top: 1px;
        border: 2px solid #dbe3f2; border-top-color: #315bc5;
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.5; }
      #substatus { margin: 3px 0 0; color: #667085; font-size: 13px; line-height: 1.5; }
      .progress { display: none; margin-top: 24px; }
      .progress.visible { display: block; }
      .progress-header {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 18px; margin-bottom: 9px;
      }
      #stage { min-width: 0; color: #344054; font-size: 13px; font-weight: 650; }
      #measure {
        flex: 0 0 auto; color: #667085; font-size: 12px;
        font-variant-numeric: tabular-nums; text-align: right;
      }
      .track { height: 8px; overflow: hidden; background: #e7ebf2; border-radius: 999px; }
      .bar {
        height: 100%; width: 0; background: #315bc5;
        border-radius: inherit; transition: width 220ms ease;
      }
      .track.indeterminate .bar { width: 34%; animation: travel 1.45s ease-in-out infinite; }
      @keyframes travel { from { transform: translateX(-110%); } to { transform: translateX(310%); } }
      #detail { margin: 10px 0 0; color: #475467; font-size: 13px; line-height: 1.5; }
      #meta { margin: 4px 0 0; color: #7a8699; font-size: 12px; line-height: 1.5; }
      #critical {
        display: none; margin-top: 15px; padding: 10px 12px;
        border-radius: 9px; background: #fff7e8; color: #7a4b0b;
        font-size: 12px; line-height: 1.45;
      }
      #critical.visible { display: block; }
      #warning { display: none; margin: 12px 0 0; color: #9a5b08; font-size: 12px; }
      details { display: none; margin-top: 14px; color: #667085; font-size: 12px; }
      details.visible { display: block; }
      summary { cursor: pointer; user-select: none; }
      #technical { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .error {
        display: none; margin-top: 20px; padding-top: 20px;
        border-top: 1px solid #e6e9ef;
      }
      .error.visible { display: block; }
      #err {
        margin: 0; color: #8b1e2d; font-size: 13px; line-height: 1.55;
        white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
      button {
        min-height: 38px; padding: 8px 14px; border: 1px solid #cfd6e2;
        border-radius: 8px; background: white; color: #344054;
        font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #f8fafc; border-color: #aeb8c8; }
      button.primary { background: #315bc5; border-color: #315bc5; color: white; }
      button.primary:hover { background: #274ba7; }
      button.quiet { border-color: transparent; }
      @media (max-width: 540px) {
        body { padding: 18px; }
        .card { padding: 26px 22px; }
        .progress-header { align-items: flex-start; flex-direction: column; gap: 4px; }
        #measure { text-align: left; }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 2.4s; }
        .track.indeterminate .bar { animation: none; width: 100%; opacity: 0.45; }
        .bar { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <div class="mark" aria-hidden="true">Q</div>
        <div><h1>QuantEM</h1><p class="eyebrow">Electron microscopy analysis</p></div>
      </div>

      <div class="status-row" aria-live="polite" aria-atomic="false">
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <div>
          <p id="status">Starting QuantEM</p>
          <p id="substatus">Preparing the local application&hellip;</p>
        </div>
      </div>

      <section class="progress" id="startup-progress" aria-label="Startup progress">
        <div class="progress-header"><span id="stage"></span><span id="measure"></span></div>
        <div class="track indeterminate" id="track" role="progressbar" aria-label="Startup progress">
          <div class="bar" id="bar"></div>
        </div>
        <p id="detail"></p>
        <p id="meta"></p>
        <div id="critical">Keep QuantEM open while this database operation finishes. Closing now may require recovery on the next launch.</div>
        <p id="warning"></p>
        <details id="technical-details"><summary>Technical details</summary><p id="technical"></p></details>
      </section>

      <section class="error" id="error-panel" role="alert">
        <p id="err"></p>
        <div class="actions">
          <button class="primary" id="retry" type="button">Retry</button>
          <button id="open-logs" type="button">Open logs</button>
          <button id="copy-diagnostics" type="button">Copy diagnostics</button>
          <button class="quiet" id="quit" type="button">Quit</button>
        </div>
      </section>
    </main>

    <script>
      var lastEvent = null;
      var lastFailure = "";
      function element(id) { return document.getElementById(id); }
      function invoke(command) {
        if (window.__TAURI__ && window.__TAURI__.core) return window.__TAURI__.core.invoke(command);
        return Promise.reject(new Error("Desktop command API unavailable"));
      }
      function copyText(value) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(value);
        }
        return new Promise(function (resolve, reject) {
          var input = document.createElement("textarea");
          input.value = value; input.style.position = "fixed"; input.style.opacity = "0";
          document.body.appendChild(input); input.select();
          var copied = document.execCommand("copy");
          input.remove();
          copied ? resolve() : reject(new Error("Clipboard unavailable"));
        });
      }
      function duration(seconds) {
        seconds = Math.max(0, Math.round(Number(seconds) || 0));
        if (seconds < 60) return seconds + "s";
        var minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + "m " + (seconds % 60) + "s";
        return Math.floor(minutes / 60) + "h " + (minutes % 60) + "m";
      }
      function count(value) { return Number(value).toLocaleString(); }
      function humanBytes(value) {
        var bytes = Number(value), units = ["B", "KB", "MB", "GB", "TB"], index = 0;
        if (!Number.isFinite(bytes)) return "";
        while (bytes >= 1000 && index < units.length - 1) { bytes /= 1000; index += 1; }
        return (index === 0 ? Math.round(bytes) : bytes.toFixed(bytes >= 10 ? 1 : 2)) + " " + units[index];
      }
      function measuredText(event) {
        var percent = Number(event.percent), parts = [];
        if (event.percent != null && Number.isFinite(percent)) parts.push(percent.toFixed(1) + "%");
        if (event.completed != null) {
          var completed = event.unit === "bytes" ? humanBytes(event.completed) : count(event.completed);
          if (event.total != null) {
            var total = event.unit === "bytes" ? humanBytes(event.total) : count(event.total);
            parts.push(completed + " / " + total + (event.unit === "bytes" ? "" : " " + (event.unit || "")));
          } else if (Number(event.completed) > 0) {
            parts.push(completed + (event.unit === "bytes" ? " written" : " " + (event.unit || "")));
          }
        }
        return parts.join(" · ") || "Working…";
      }
      function showFailure(message, event) {
        lastFailure = message || "The server stopped before startup completed.";
        element("spinner").style.display = "none";
        element("status").textContent = "QuantEM could not start";
        element("substatus").textContent = event && event.failed_phase
          ? "Startup stopped during “" + event.failed_phase + "”."
          : "The local application did not become ready.";
        element("critical").classList.remove("visible");
        element("error-panel").classList.add("visible");
        element("err").textContent = lastFailure;
      }
      window.__quantemStartupProgress = function (event) {
        lastEvent = event;
        if (event.phase === "failed" || event.category === "failure") {
          showFailure(event.detail, event); return;
        }
        element("startup-progress").classList.add("visible");
        element("stage").textContent = event.message || "Starting QuantEM";
        element("detail").textContent = event.detail || "";
        element("measure").textContent = measuredText(event);

        var isUpgrade = event.category === "database-upgrade";
        var isRecovery = event.category === "database-recovery";
        if (event.phase === "upgrade-complete") {
          element("status").textContent = "Update complete — opening QuantEM";
          element("substatus").textContent = "Finishing application startup…";
        } else if (isRecovery) {
          element("status").textContent = "Recovering the database";
          element("substatus").textContent = "QuantEM is repairing an interrupted shutdown safely.";
        } else if (isUpgrade) {
          element("status").textContent = "Updating QuantEM’s database";
          element("substatus").textContent = "Your library and a recovery snapshot are being preserved.";
        } else if (event.phase === "ready") {
          element("status").textContent = "Opening QuantEM";
          element("substatus").textContent = "The local application is ready.";
        } else {
          element("status").textContent = "Starting QuantEM";
          element("substatus").textContent = "Preparing the local application…";
        }

        var track = element("track"), bar = element("bar"), percent = Number(event.percent);
        if (event.percent != null && Number.isFinite(percent)) {
          track.classList.remove("indeterminate");
          track.setAttribute("aria-valuemin", "0"); track.setAttribute("aria-valuemax", "100");
          track.setAttribute("aria-valuenow", String(percent));
          bar.style.width = Math.max(0, Math.min(100, percent)) + "%";
        } else {
          track.classList.add("indeterminate"); track.removeAttribute("aria-valuenow"); bar.style.width = "";
        }

        var meta = "Elapsed " + duration(event.elapsed_seconds);
        if (event.eta_seconds != null && event.eta_seconds > 0) meta += " · about " + duration(event.eta_seconds) + " remaining";
        else if (Number(event.last_progress_seconds) >= 30) meta += " · last measurable progress " + duration(event.last_progress_seconds) + " ago";
        else meta += " · active now";
        element("meta").textContent = meta;
        element("critical").classList.toggle("visible", Boolean(event.critical && !event.can_close));

        var warning = element("warning");
        var stalled = event.phase === "stalled" || Number(event.last_progress_seconds) >= 300;
        warning.style.display = stalled ? "block" : "none";
        warning.textContent = stalled ? "No recent measurable progress was reported. QuantEM is still waiting; expand Technical details if this continues." : "";

        var technical = [];
        if (event.technical_detail) technical.push(String(event.technical_detail));
        if (event.current_lsn) technical.push("PostgreSQL recovery position: " + event.current_lsn);
        element("technical").textContent = technical.join("\n");
        element("technical-details").classList.toggle("visible", technical.length > 0);
      };
      window.__quantemStatus = function (text) { element("substatus").textContent = text; };
      window.__quantemFailed = function (text) { showFailure(text, null); };
      element("open-logs").addEventListener("click", function () { invoke("open_startup_logs"); });
      element("retry").addEventListener("click", function () { invoke("retry_startup"); });
      element("quit").addEventListener("click", function () { invoke("quit_app"); });
      element("copy-diagnostics").addEventListener("click", function () {
        var diagnostics = ["QuantEM startup failure", lastFailure, "Startup event: " + JSON.stringify(lastEvent || {}, null, 2), "Platform: " + navigator.userAgent].join("\n\n");
        copyText(diagnostics).then(function () {
          element("copy-diagnostics").textContent = "Copied";
        }).catch(function () { element("copy-diagnostics").textContent = "Copy failed"; });
      });
    </script>
  </body>
</html>
