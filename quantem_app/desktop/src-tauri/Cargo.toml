[package]
name = "quantem-desktop"
version = "0.1.4"
description = "QuantEM desktop shell: spawns the quantem-server sidecar and hosts its UI"
authors = ["Arrojo e Drigo Lab, Vanderbilt University"]
license = "BSD-3-Clause"
edition = "2021"
rust-version = "1.77"

# The shipped executable is QuantEM.exe in every channel. Naming the binary
# here (rather than tauri.conf.json `mainBinaryName`) means cargo itself
# produces QuantEM.exe, so the NSIS bundle, the portable zip and the docs all
# agree without a rename step. The frozen sidecar's default data directory
# (`<install>\data`) does not depend on this name, and neither does the
# shell's (it uses its own path at runtime).
[[bin]]
name = "QuantEM"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target."cfg(windows)".dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
]

[profile.release]
# The shell does nothing hot; optimise for size and simple debugging.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
