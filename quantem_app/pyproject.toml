[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantem-app"
version = "0.1.0"
description = "QuantEM — organelle segmentation, proofreading, and quantitative analysis for electron microscopy"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Arrojo e Drigo Lab, Vanderbilt University" }]
keywords = ["electron microscopy", "segmentation", "vision transformer", "organelle", "cell biology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Kept deliberately small. Every entry below is imported by code that ships.
# The legacy geospatial, task-broker and multi-framework stack is gone
# (tensorflow, tf-keras, h5py, cellpose, xgboost, PyMaxflow, psycopg2,
# djangorestframework-gis, matplotlib, torchaudio, segmentation-models-pytorch,
# dynamic-network-architectures).
dependencies = [
    # --- web/service layer (loopback only; single user) ---
    # Django 5.2 is the *latest LTS* (6.x is a regular release, not an LTS) and
    # is supported to 2028. A floating `>=6.0,<7.0` now resolves to
    # 6.1 — a version DRF cannot import (`cc_delim_re` was removed from
    # django.utils.cache). A desktop app people install from PyPI over several
    # years wants the LTS, not the newest.
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-environ>=0.11",
    "django-cors-headers>=4.0",
    "django-filter>=24.0",
    "waitress>=3.0",
    # --- numerics & imaging ---
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.8",
    "shapely>=2.0",               # replaces GeoDjango/GEOS entirely
    "Pillow>=10.0",
    "pandas>=2.0",                # analysis exports
    # --- image I/O ---
    "tifffile>=2024.0",
    "imagecodecs>=2024.0",
    "zarr>=3.1,<4.0",             # stores are written v2 for Viv compatibility
    "numcodecs>=0.16",
    # v1 reads TIFF and PNG only (owner ruling 2026-08-06). Dropping the exotic
    # readers removed mrcfile, nd2 and rosettasciio. Restoring .mrc — the most
    # likely next format, for tomography — is one dependency plus the reader
    # branch; see quantem/assets/volume_readers.py. rosettasciio (.dm3/.dm4) is
    # GPL-3.0-or-later, so its removal also clears the frozen-installer question.
    # --- models ---
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",                  # OmniEM ViT-L builds through timm
    "huggingface-hub>=0.23",      # model registry download
    # Imported directly (registry/hf.py, registry/hf_install.py,
    # inference/encoders.py), not just through timm — declare it, or the pin
    # rides on timm's dependency list staying the same.
    "safetensors>=0.4",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Native libvips accelerator for large-image decode. Optional: every call site
# falls back to Pillow (quantem/assets/task_utils.py, ngff.py, utils.py).
vips = ["pyvips>=2.2"]
# Native desktop window for the pip/conda channel. The Tauri/Electron installer
# wraps the same package and does not need this.
desktop = ["pywebview>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
quantem-app = "quantem.cli:main"

[project.urls]
Homepage = "https://github.com/ArrojoDrigoLab/QuantEM"
Source = "https://github.com/ArrojoDrigoLab/QuantEM"

# ---------------------------------------------------------------------------
# Distribution. The wheel is the product: `pip install quantem-app` must give the
# whole application, UI included, with no node and no checkout. The version has
# exactly one source — [project].version above; src/quantem/__init__.py reads
# it back through importlib.metadata (or this file, in an uninstalled checkout).
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/quantem"]
# Deliberate: the wheel ships no tests. They assume a dev checkout (pytest-django,
# `-p quantem._pytest_env`, fixture trees) and would drag dev-only docstrings into
# a public artifact; the sdist keeps them so a rebuild can still run the suite.
#
# `.env` is the checkout-only data-dir redirect. Git ignores it, but the wheel
# is built *from the sdist*, where no .gitignore exists to drop it — so it must
# be excluded by name in BOTH targets or a machine-local path ships.
#
# In-package READMEs are development documents; the runtime never reads them.
# The sdist keeps them with the rest of the source.
exclude = ["**/tests/**", "**/.env", "**/README.md"]

# The built frontend rides inside the package as `quantem/_frontend/`, where
# quantem.core.spa resolves it via importlib.resources when not running from a
# checkout. Build `frontend/` (npm run build) before `python -m build`.
[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "quantem/_frontend"

# The sdist is what the conda recipe builds from, so it must produce the same
# wheel without node: the *built* frontend ships in it, the frontend sources do
# not (they live in the repository, not in the Python distribution).
[tool.hatch.build.targets.sdist]
# The leading slash roots each pattern at the project directory. Unrooted,
# hatchling treats "README.md" as a recursive glob — a build with these
# unanchored swept 800+ READMEs and LICENSEs out of frontend/node_modules and
# desktop/ into the sdist. packaging/check_wheel.py now fails on any
# node_modules path, so that regression cannot ship twice.
include = [
    "/src/quantem",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]
exclude = ["**/__pycache__", "**/.env"]

# force-include, not include: frontend/dist is VCS-ignored (it is a build
# product), and hatchling's normal selection honours .gitignore — a plain
# include silently ships an sdist with no frontend, and the wheel build from
# that sdist then fails its own force-include. Forced paths bypass the ignore
# rules.
[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"

# ---------------------------------------------------------------------------
# Tooling.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TID"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # Django/DRF idiom: callables in defaults
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "SIM"]
# Barrel modules exist to re-export. `ruff check --fix` stripped these once and
# broke 57 tests; F401 must never be auto-fixed here.
"**/__init__.py" = ["F401", "F403"]
"**/api_views/segments/shared.py" = ["F401"]
# These modules set `Image.MAX_IMAGE_PIXELS = None` between import blocks so
# Pillow does not refuse large EM images. Reordering that below the imports
# would be a behaviour change, not a style fix.
"src/quantem/assets/utils.py" = ["E402"]
"src/quantem/assets/task_utils.py" = ["E402"]
"src/quantem/segmentation/utils.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["src/quantem"]
ignore_missing_imports = true
follow_imports = "silent"
# Ratcheted, not aspirational: new packages are strict, ported ones are not yet.
[[tool.mypy.overrides]]
module = ["quantem.inference.*", "quantem.finetune.*", "quantem.analysis.*", "quantem.registry.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "quantem.core.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["src/quantem"]
# -p quantem._pytest_env redirects the data directory before pytest-django
# sets Django up; see that module for why a conftest.py is too late.
#
# `-m "not requires_network"` is the offline lane, and it is the default lane
# on purpose. This application's first invariant is that it works with no
# internet; a suite that cannot be run green without one contradicts the
# product it is testing, and a contributor on a train reads the resulting red
# as "I broke something". The one test it deselects
# (registry/tests/test_hf_live.py) says so in its own docstring but nothing
# acted on that, so a plain `pytest` reached out to huggingface.co and failed
# with `OfflineModeIsEnabled` on any machine that had opted out of the network.
# The network lane is one word: `pytest -m requires_network`, which overrides
# this expression because a command-line -m wins.
addopts = "-q --strict-markers -p quantem._pytest_env -m 'not requires_network'"
markers = [
    "requires_weights: needs model weights downloaded from the registry",
    "requires_gpu: needs CUDA or MPS",
    # Deselected by the default lane through addopts above -- not merely
    # documented as excluded, which is what it was.
    "requires_network: reaches the live Hugging Face repository over the internet; deselected by the default lane, run it with `pytest -m requires_network`",
    "slow: excluded from the CI lane (.github/workflows/quantem-app.yml), which runs `-m \"not requires_weights and not requires_gpu and not slow\"`",
]
