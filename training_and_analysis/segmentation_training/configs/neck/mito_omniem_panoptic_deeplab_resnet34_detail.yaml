# Neck-ablation arm: mitochondria on OmniEM; resnet34_detail, panoptic_deeplab head; LoRA rank 8; dice_bce loss; 10,000 steps; encoder lr 0.001.
name: mito_omniem_panoptic_deeplab_resnet34_detail
notes: 'Neck-ablation arm: mitochondria on OmniEM; resnet34_detail, panoptic_deeplab head; LoRA rank 8; dice_bce loss; 10,000 steps; encoder lr 0.001.'
device: cuda
amp: true
num_workers: 8
encoder:
  run_dir: <OmniEM ViT-L encoder run directory>
  tile_size: 512
  feature_layers: last4
  apply_encoder_norm: true
  adapt: lora
  adapt_params:
    rank: 8
    conv: false
neck:
  type: resnet34_detail
decoder:
  type: panoptic_deeplab
  params: {}
loss:
  terms:
  - type: dice_bce
    weight: 1.0
data:
  bucket: canonical
  organelle: mito
  task: instance
  min_fg_frac_keep: 0.1
optim:
  max_steps: 10000
  warmup_steps: 625
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  seed: 0
  adapter_lr: 0.001
eval:
  overlap: 0.25
  fg_threshold: 0.5
  instance_min_size: 16
  bootstrap_n: 1000
  max_eval_crops: 300
