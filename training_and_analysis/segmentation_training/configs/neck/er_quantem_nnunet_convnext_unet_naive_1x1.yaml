# Neck-ablation arm: ER on QuantEM; naive_1x1, nnunet_convnext_unet head; full encoder fine-tuning; dice_bce loss; 10,000 steps; encoder lr 2e-05.
name: er_quantem_nnunet_convnext_unet_naive_1x1
notes: 'Neck-ablation arm: ER on QuantEM; naive_1x1, nnunet_convnext_unet head; full encoder fine-tuning; dice_bce loss; 10,000 steps; encoder lr 2e-05.'
device: cuda
amp: true
num_workers: 8
encoder:
  run_dir: <QuantEM ViT-B encoder run directory>
  tile_size: 512
  feature_layers: last4
  apply_encoder_norm: true
  adapt: full
neck:
  type: naive_1x1
decoder:
  type: nnunet_convnext_unet
  params: {}
loss:
  terms:
  - type: dice_bce
    weight: 1.0
data:
  bucket: canonical
  organelle: er
  task: semantic
  min_fg_frac_keep: 0.1
optim:
  max_steps: 10000
  warmup_steps: 625
  batch_size: 4
  lr: 0.001
  weight_decay: 0.0001
  seed: 0
  adapter_lr: 2.0e-05
  grad_accum: 2
eval:
  overlap: 0.25
  fg_threshold: 0.5
  instance_min_size: 16
  bootstrap_n: 1000
  max_eval_crops: 300
