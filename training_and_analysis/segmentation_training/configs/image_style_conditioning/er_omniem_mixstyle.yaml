# Image-style-conditioning arm: ER on OmniEM; resnet34_detail, dpt head; LoRA rank 8; dice_bce loss; 10,000 steps; encoder lr 0.001; randomised feature-statistic conditioning.
name: er_omniem_mixstyle
notes: 'Image-style-conditioning arm: ER on OmniEM; resnet34_detail, dpt head; LoRA rank 8; dice_bce loss; 10,000 steps; encoder lr 0.001; randomised feature-statistic conditioning.'
device: cuda
amp: true
num_workers: 8
encoder:
  run_dir: <OmniEM ViT-L encoder run directory>
  tile_size: 512
  feature_layers: last4
  apply_encoder_norm: true
  adapt: lora
  adapt_params:
    rank: 8
    conv: false
neck:
  type: resnet34_detail
decoder:
  type: dpt
loss:
  terms:
  - type: dice_bce
    weight: 1.0
data:
  bucket: canonical
  organelle: er
  task: semantic
  min_fg_frac_keep: 0.1
optim:
  max_steps: 10000
  warmup_steps: 625
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  seed: 0
  adapter_lr: 0.001
eval:
  overlap: 0.25
  fg_threshold: 0.5
  instance_min_size: 16
  bootstrap_n: 1000
cond:
  arm: mixstyle_dsu
  enabled: true
  film: false
  mixstyle: mixstyle
  mixstyle_mix: crossdomain
