# Natural-image DINOv3 at ViT-L. Against OmniEM, also ViT-L, this isolates the pretraining corpus.
# Simeoni, O. et al. DINOv3. arXiv:2508.10104 (2025).
name: dinov3_meta_vitl
timm_model: vit_large_patch16_dinov3
weight_file: model.safetensors
objective: dinov3
arch: vit_large
patch_size: 16
embed_dim: 1024
depth: 24
in_chans: 3
base_tile: 512
img_size_build: 256
norm_mean: [0.485, 0.456, 0.406]
norm_std: [0.229, 0.224, 0.225]
# RoPE: position is generated per forward from normalised coordinates, so this encoder can read a
# larger context window and is included in the context sweep.
context_sweepable: true
