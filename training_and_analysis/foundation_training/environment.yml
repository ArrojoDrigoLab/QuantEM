# Pretraining environment.
#
# The released encoder was trained on 2x NVIDIA H100 NVL, global batch 128, bf16,
# FSDP SHARD_GRAD_OP, torch.compile disabled. Roughly 15 GPU-days to step 674999,
# plus ~1 TB for the shard bundle.
#
# Decoder training used a different stack; see ../segmentation_training/environment.yml.
name: quantem-foundation-training
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pillow
  - tifffile
  - omegaconf
  - pyyaml
  - pytest
  # build_shards writes a parquet record table and a progress bar
  - pandas
  - pyarrow
  - tqdm
  # the metadata diagnostics probe how decodable each factor is, and plot it
  - scikit-learn
  - matplotlib
  # clDice skeletonisation in the evaluation metrics
  - scikit-image
  # some published baseline encoders ship as safetensors
  - safetensors
  - pip
  - pip:
      # The published baseline encoders (EMCellFound, OmniEM, DINOv2/DINOv3 ViT-L) are timm ViTs;
      # foundation_baselines.external_vit builds and loads them through it. Nothing this project
      # trains uses timm.
      - timm
      # Torch comes from PyTorch's own index, not conda: the CUDA 13.0 build of 2.12.1 is what the
      # reported runs used, and the conda `pytorch-cuda` metapackage stops at 12.x.
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.12.1
      - torchvision

# Upstream DINOv3 is not installed here. It is obtained separately under Meta's terms and installed
# into this environment at the commit recorded in third_party/dinov3.pin, which is on a feature branch
# rather than main:
#
#   pip install /path/to/dinov3        (after checking out that commit)
