# Adapted UPerNet probe: LoRA encoder adaptation. Identical to probe_upernet_frozen.yaml
# except adapt=lora. Same evaluation dataset / decoder / eval / fractions; the encoder now trains low-rank
# adapters (base weights frozen). The mechanism and settings match the LoRA arm of the encoder-adaptation experiment.
decoder: upernet
tile_size: 512
compare_tile: 512
feature_layers: last4
apply_encoder_norm: true
num_classes: 2

max_steps: 4000
warmup_steps: 200
batch_size: 32
lr: 0.001
weight_decay: 0.0001
dice_weight: 1.0
ce_weight: 1.0
seed: 0

label_fractions: [1.0]
flip: true
rot90: true
intensity_jitter: 0.1

eval_overlap: 0.25
eval_batch_windows: 16
bootstrap_n: 300
eval_workers: 4
num_workers: 4   # overlap disk loads with GPU compute

cache_train_features: false   # adaptation REQUIRES uncached (cached features are static)
amp: true

# --- encoder adaptation: LoRA, matching the encoder-adaptation experiment ---
adapt: lora
adapt_params: {rank: 8, conv: false}
adapter_lr: 0.001
